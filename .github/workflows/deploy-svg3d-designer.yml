name: Deploy SVG-to-3D Designer to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/svg-3d-print-designer-motvtz
    paths:
      - 'svg3d-designer/**'
      - '.github/workflows/deploy-svg3d-designer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: svg3d-designer/package-lock.json

      - name: Install dependencies
        working-directory: svg3d-designer
        run: npm ci

      - name: Build
        working-directory: svg3d-designer
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: svg3d-designer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
