<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px 16px;
    font: 12px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1d1d22; background: #fff;
  }
  .task { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; color: #1d1d22; }
  .task span { color: #6a6a75; font-weight: 400; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  button {
    font: inherit; font-size: 11px; border: 1px solid #e3e3e8; background: #f5f5f7; color: #1d1d22;
    border-radius: 6px; padding: 5px 9px; cursor: pointer;
  }
  button:hover { border-color: #cfcfd6; background: #ececf0; }
  button.primary { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
  button.primary:hover { background: #3450c2; }
  button.ghost { background: transparent; border-color: transparent; color: #6a6a75; }
  input[type=date] {
    font: inherit; width: 100%; padding: 6px 8px; border: 1px solid #cfcfd6; border-radius: 6px;
    margin-bottom: 12px; color: #1d1d22;
  }
  .row { display: flex; gap: 6px; justify-content: flex-end; }
  .row .spacer { flex: 1; }
</style>
</head>
<body>
  <div class="task" id="task">Due date</div>
  <div class="quick">
    <button data-days="0">Today</button>
    <button data-days="1">Tomorrow</button>
    <button id="nextMon">Next Monday</button>
    <button data-days="7">In a week</button>
  </div>
  <input type="date" id="date" />
  <div class="row">
    <button class="ghost" id="clear">Clear date</button>
    <span class="spacer"></span>
    <button id="cancel">Cancel</button>
    <button class="primary" id="set">Set date</button>
  </div>
<script>
  const pad = (n) => (n < 10 ? '0' + n : '' + n)
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  const dateEl = document.getElementById('date')
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*')

  window.onmessage = (e) => {
    const m = e.data && e.data.pluginMessage
    if (!m || m.type !== 'init') return
    document.getElementById('task').innerHTML =
      (m.title ? escapeHtml(m.title) : 'New task') + ' <span>· due date</span>'
    dateEl.value = m.value || m.today || ''
    dateEl.focus()
  }
  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

  document.querySelectorAll('button[data-days]').forEach((b) => {
    b.onclick = () => {
      const d = new Date(); d.setDate(d.getDate() + parseInt(b.dataset.days, 10))
      send({ type: 'set', value: iso(d) })
    }
  })
  document.getElementById('nextMon').onclick = () => {
    const d = new Date(); const day = d.getDay()
    d.setDate(d.getDate() + (day === 0 ? 1 : 8 - day))
    send({ type: 'set', value: iso(d) })
  }
  document.getElementById('set').onclick = () => send({ type: 'set', value: dateEl.value || null })
  document.getElementById('clear').onclick = () => send({ type: 'set', value: null })
  document.getElementById('cancel').onclick = () => send({ type: 'cancel' })
  dateEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send({ type: 'set', value: dateEl.value || null }) })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') send({ type: 'cancel' }) })
</script>
</body>
</html>
