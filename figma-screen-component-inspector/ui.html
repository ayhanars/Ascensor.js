<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Screen Component Inspector</title>
<style>
  :root {
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --border: #e5e5e5;
    --bg: #ffffff;
    --bg-subtle: #f7f7f7;
    --accent: #18a0fb;
    --badge-component: #eef6ff;
    --badge-component-text: #0d7ae0;
    --badge-atom: #eefbf3;
    --badge-atom-text: #0f9d58;
    --badge-unclassified: #f2f2f2;
    --badge-unclassified-text: #6b6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  header .screen-name {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 0;
    word-break: break-word;
  }

  header .screen-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
  }
  header .screen-link:hover { text-decoration: underline; }

  header .screen-link-disabled {
    color: var(--text-muted);
    font-size: 11px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 4px;
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    margin-left: 8px;
  }
  .refresh-btn:hover { background: var(--bg-subtle); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 16px 0;
  }

  .section-title-row {
    padding: 14px 16px 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .filters {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .filter-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .filter-toggle input { margin: 0; cursor: pointer; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .title {
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .empty-state .subtitle {
    font-size: 12px;
    line-height: 1.5;
  }

  .filtered-empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .item {
    border-bottom: 1px solid var(--border);
  }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
  }
  .item-row:hover { background: var(--bg-subtle); }

  .item-main {
    min-width: 0;
    flex: 1;
  }

  .item-name {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-variant {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge-component { background: var(--badge-component); color: var(--badge-component-text); }
  .badge-atom { background: var(--badge-atom); color: var(--badge-atom-text); }
  .badge-unclassified { background: var(--badge-unclassified); color: var(--badge-unclassified-text); }

  .item-count {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    font-weight: 500;
    margin-left: 12px;
    margin-right: 8px;
  }

  .select-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0;
  }
  .select-btn:hover { background: var(--border); color: var(--text); }

  .chevron {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    transition: transform 0.15s ease;
    margin-left: 2px;
  }
  .item.expanded .chevron { transform: rotate(90deg); }

  .item-detail {
    display: none;
    padding: 0 16px 14px 16px;
  }
  .item.expanded .item-detail { display: block; }

  .detail-block { margin-top: 10px; }
  .detail-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .detail-value {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .detail-value.muted { color: var(--text-muted); font-style: italic; }

  .content-instance-heading {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 8px 0 2px 0;
  }
  .content-instance-heading:first-child { margin-top: 0; }

  .content-row {
    display: flex;
    gap: 6px;
    font-size: 12px;
    line-height: 1.6;
  }
  .content-label {
    color: var(--text-muted);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .content-label::after { content: ':'; }
  .content-value {
    color: var(--text);
    word-break: break-word;
  }

  .tag-chip {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    margin: 0 4px 4px 0;
  }

  .link-row { display: block; margin-bottom: 4px; }
  .link-row a {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    word-break: break-all;
  }
  .link-row a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="toolbar">
    <div style="min-width:0;">
      <p class="screen-name" id="screen-name">—</p>
      <a id="screen-link" class="screen-link" href="#" target="_blank" style="display:none;">Open in Figma ↗</a>
      <span id="screen-link-disabled" class="screen-link-disabled" style="display:none;">Figma link unavailable in this session — see README</span>
    </div>
    <button class="refresh-btn" id="refresh-btn" title="Re-analyze selection">Refresh</button>
  </div>
</header>

<main id="main">
  <div class="empty-state" id="empty-state">
    <div class="title">Select a screen to inspect.</div>
    <div class="subtitle">Select a Figma frame to see its<br/>components and metadata.</div>
  </div>
  <div id="component-section" style="display:none;">
    <div class="section-title-row">
      <span class="section-title" id="components-title">Components</span>
      <div class="filters">
        <label class="filter-toggle">
          <input type="checkbox" id="show-unclassified-toggle" />
          Show unclassified
        </label>
        <label class="filter-toggle">
          <input type="checkbox" id="hide-atoms-toggle" checked />
          Hide atoms
        </label>
      </div>
    </div>
    <div id="component-list"></div>
  </div>
</main>

<script>
  var mainEl = document.getElementById('main');
  var emptyStateEl = document.getElementById('empty-state');
  var componentSectionEl = document.getElementById('component-section');
  var componentListEl = document.getElementById('component-list');
  var componentsTitleEl = document.getElementById('components-title');
  var screenNameEl = document.getElementById('screen-name');
  var screenLinkEl = document.getElementById('screen-link');
  var screenLinkDisabledEl = document.getElementById('screen-link-disabled');
  var refreshBtn = document.getElementById('refresh-btn');
  var showUnclassifiedToggle = document.getElementById('show-unclassified-toggle');
  var hideAtomsToggle = document.getElementById('hide-atoms-toggle');

  var lastComponents = [];
  var showUnclassified = false;
  var hideAtoms = hideAtomsToggle.checked;

  refreshBtn.addEventListener('click', function () {
    parent.postMessage({ pluginMessage: { type: 'refresh' } }, '*');
  });

  showUnclassifiedToggle.addEventListener('change', function () {
    showUnclassified = showUnclassifiedToggle.checked;
    renderFilteredList();
  });

  hideAtomsToggle.addEventListener('change', function () {
    hideAtoms = hideAtomsToggle.checked;
    renderFilteredList();
  });

  var EMPTY_STATES = {
    'no-selection': {
      title: 'Select a screen to inspect.',
      subtitle: 'Select a Figma frame to see its<br/>components and metadata.'
    },
    'invalid-selection': {
      title: 'Select a valid screen or frame.',
      subtitle: ''
    },
    'no-components': {
      title: 'No components found.',
      subtitle: "This screen doesn't contain any<br/>recognized components."
    }
  };

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function badgeClassFor(classification) {
    if (classification === 'DS Component') return 'badge-component';
    if (classification === 'DS Atom') return 'badge-atom';
    return 'badge-unclassified';
  }

  function showEmptyState(reason) {
    var state = EMPTY_STATES[reason] || EMPTY_STATES['no-selection'];
    emptyStateEl.querySelector('.title').innerHTML = escapeHtml(state.title);
    emptyStateEl.querySelector('.subtitle').innerHTML = state.subtitle;
    emptyStateEl.style.display = 'block';
    componentSectionEl.style.display = 'none';
  }

  function renderScreenHeader(screen) {
    screenNameEl.textContent = screen.name;
    if (screen.link) {
      screenLinkEl.href = screen.link;
      screenLinkEl.style.display = 'inline';
      screenLinkDisabledEl.style.display = 'none';
    } else {
      screenLinkEl.style.display = 'none';
      screenLinkDisabledEl.style.display = 'inline';
    }
  }

  function buildItemEl(comp) {
    var item = document.createElement('div');
    item.className = 'item';

    var tagsHtml = comp.tags.length
      ? comp.tags.map(function (t) { return '<span class="tag-chip">' + escapeHtml(t) + '</span>'; }).join('')
      : '<span class="detail-value muted">No tags found.</span>';

    var descriptionHtml = comp.description && comp.description.trim()
      ? '<div class="detail-value">' + escapeHtml(comp.description) + '</div>'
      : '<div class="detail-value muted">No description provided.</div>';

    var hasContent = comp.content.some(function (instLayers) { return instLayers.length > 0; });
    var contentHtml = hasContent
      ? comp.content.map(function (instLayers, idx) {
          if (!instLayers.length) return '';
          var heading = comp.content.length > 1
            ? '<div class="content-instance-heading">Instance ' + (idx + 1) + '</div>'
            : '';
          var rows = instLayers.map(function (t) {
            var value = t.characters && t.characters.length ? t.characters : '(empty)';
            return '<div class="content-row"><span class="content-label">' + escapeHtml(t.name) + '</span><span class="content-value">' + escapeHtml(value) + '</span></div>';
          }).join('');
          return heading + rows;
        }).join('')
      : '<div class="detail-value muted">No text layers found.</div>';

    var linksHtml = comp.links.length
      ? comp.links.map(function (l) {
          var label = l.name ? l.name : l.url;
          return '<span class="link-row"><a href="' + escapeHtml(l.url) + '" target="_blank">' + escapeHtml(label) + ' ↗</a></span>';
        }).join('')
      : '<div class="detail-value muted">No links available for this component.</div>';

    var variantHtml = comp.variantName
      ? '<div class="item-variant">' + escapeHtml(comp.variantName) + '</div>'
      : '';

    item.innerHTML =
      '<div class="item-row">' +
        '<div class="item-main">' +
          '<div class="item-name">' + escapeHtml(comp.name) + '</div>' +
          variantHtml +
          '<div class="item-badges"><span class="badge ' + badgeClassFor(comp.classification) + '">' + escapeHtml(comp.classification) + '</span></div>' +
        '</div>' +
        '<div class="item-count">&times; ' + comp.count + '</div>' +
        '<button class="select-btn" type="button" title="Select instance' + (comp.count === 1 ? '' : 's') + ' on canvas">' +
          '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        '</button>' +
        '<svg class="chevron" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</div>' +
      '<div class="item-detail">' +
        '<div class="detail-block"><div class="detail-label">Tags</div>' + tagsHtml + '</div>' +
        '<div class="detail-block"><div class="detail-label">Description</div>' + descriptionHtml + '</div>' +
        '<div class="detail-block"><div class="detail-label">Content</div>' + contentHtml + '</div>' +
        '<div class="detail-block"><div class="detail-label">Links</div>' + linksHtml + '</div>' +
      '</div>';

    item.querySelector('.item-row').addEventListener('click', function () {
      item.classList.toggle('expanded');
    });

    item.querySelector('.select-btn').addEventListener('click', function (event) {
      event.stopPropagation();
      parent.postMessage({ pluginMessage: { type: 'select', ids: comp.instanceIds } }, '*');
    });

    return item;
  }

  // Renders the current filter state against the last full result received
  // from the plugin. Called on new data and on toggling either checkbox, so
  // no re-analysis is needed. Order is always first-appearance-on-screen;
  // the checkboxes only ever hide rows, never reorder them.
  function renderFilteredList() {
    var all = lastComponents || [];
    var filtered = all.filter(function (c) {
      if (!showUnclassified && c.classification === 'Unclassified') return false;
      if (hideAtoms && c.classification === 'DS Atom') return false;
      return true;
    });

    componentsTitleEl.textContent = filtered.length === all.length
      ? 'Components (' + all.length + ')'
      : 'Components (' + filtered.length + ' of ' + all.length + ')';

    componentListEl.innerHTML = '';

    if (!filtered.length) {
      var hidden = all.length;
      var notice = document.createElement('div');
      notice.className = 'filtered-empty';
      notice.innerHTML = 'All ' + hidden + ' component' + (hidden === 1 ? '' : 's') + ' on this screen ' +
        (hidden === 1 ? 'is' : 'are') + ' hidden by the filters above.<br/>Uncheck &ldquo;Hide atoms&rdquo; or check ' +
        '&ldquo;Show unclassified&rdquo; to view ' + (hidden === 1 ? 'it' : 'them') + '.';
      componentListEl.appendChild(notice);
      return;
    }

    filtered.forEach(function (comp) {
      componentListEl.appendChild(buildItemEl(comp));
    });
  }

  function renderComponents(components) {
    lastComponents = components || [];

    if (!lastComponents.length) {
      showEmptyState('no-components');
      return;
    }

    emptyStateEl.style.display = 'none';
    componentSectionEl.style.display = 'block';
    renderFilteredList();
  }

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'empty') {
      lastComponents = [];
      screenNameEl.textContent = '—';
      screenLinkEl.style.display = 'none';
      screenLinkDisabledEl.style.display = 'none';
      showEmptyState(msg.reason);
      return;
    }

    if (msg.type === 'result') {
      renderScreenHeader(msg.screen);
      renderComponents(msg.components);
      return;
    }
  };
</script>
</body>
</html>
